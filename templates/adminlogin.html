<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #1a2a4c 100%);
            color: #fff; min-height: 100vh; overflow-x: hidden; position: relative;
        }

        .back-button {
            position: fixed; top: 20px; left: 20px; background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1001; transition: all 0.3s ease; text-decoration: none;
        }
        .back-button:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.1); }

        .auth-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px; z-index: 10; position: relative;
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 {
            font-size: 3rem; color: #00e0ff; text-shadow: 0 0 20px rgba(0, 224, 255, 0.7);
            margin-bottom: 10px; letter-spacing: 2px;
        }
        .auth-header p { color: rgba(255, 255, 255, 0.8); font-size: 1.2rem; }

        .auth-form-container {
            background: rgba(10, 15, 28, 0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 224, 255, 0.3); border-radius: 15px;
            padding: 30px; width: 100%; max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .auth-form-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 224, 255, 0.2);
        }

        .auth-form-container h3 {
            color: #00e0ff; text-align: center; margin-bottom: 25px;
            font-size: 1.8rem; text-shadow: 0 0 10px rgba(0, 224, 255, 0.5);
        }

        .form-control {
            width: 100%; padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: white; font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none; border-color: #00e0ff;
            box-shadow: 0 0 10px rgba(0, 224, 255, 0.3);
        }
        .input-icon {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: rgba(255, 255, 255, 0.5); z-index: 1;
        }
        .form-field-container { position: relative; margin-bottom: 25px; }

        .btn-primary {
            width: 100%; padding: 14px; background: #00e0ff; color: #0a0f1c;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 224, 255, 0.4); margin-bottom: 10px;
        }
        .btn-primary:hover {
            background: #00bcd4; transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 224, 255, 0.6);
        }

        .alert {
            background: rgba(0, 224, 255, 0.15);
            border: 1px solid rgba(0, 224, 255, 0.3);
            border-radius: 8px; padding: 12px 15px; margin-bottom: 20px;
            color: #00e0ff; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="{{ url_for('home1') }}" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- Login Form -->
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-user-shield me-2"></i>AK Vehicle Service</h1>
            <p>Administrative Control Panel</p>
        </div>

        <div class="auth-form-container">
            <h3 class="text-center mb-4">Admin Login</h3>

            <form id="login-form" method="POST">
                <div class="alert">
                    <i class="fas fa-info-circle me-2"></i>Access the administrative dashboard
                </div>

                <div class="form-field-container">
                    <i class="fas fa-user-tie input-icon"></i>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Admin Username" required>
                </div>

                <div class="form-field-container">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Admin Password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-2"></i>Access Admin Panel
                </button>
            </form>
        </div>
    </div>

    
<script>
    document.getElementById("login-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            alert("Please enter both username and password.");
            return;
        }

        try {
            const response = await fetch("{{ url_for('adminlogin') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alert("Login successful! Redirecting...");
                window.location.href = "{{ url_for('admin_dashboard') }}";
            } else {
                alert(result.message || "Invalid username or password.");
            }

        } catch (error) {
            console.error("Admin login error:", error);
            alert("Unable to connect to the server. Please try again.");
        }
    });
</script>

</body>
</html>
