<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    body {
      background: linear-gradient(135deg, #0a0f1c 0%, #1a2a4c 100%);
      color: #fff;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sidebar {
      width: 250px;
      background: rgba(10, 15, 28, 0.9);
      backdrop-filter: blur(10px);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
      position: fixed;
      left: 0;
      top: 0;
    }

    .logo h2 {
      color: #00e0ff;
      font-size: 1.5rem;
      text-shadow: 0 0 15px rgba(0, 224, 255, 0.7);
      margin-bottom: 40px;
    }

    .sidebar-menu { width: 100%; }

    .sidebar-menu a {
      display: block;
      width: 80%;
      margin: 10px auto;
      padding: 12px 20px;
      text-decoration: none;
      color: rgba(255,255,255,0.7);
      border-radius: 10px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: linear-gradient(90deg, #00e0ff, #008cff);
      color: white;
      box-shadow: 0 0 15px rgba(0,224,255,0.5);
    }

    .main-content {
      flex: 1;
      margin-left: 250px;
      padding: 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 2rem;
      color: #00e0ff;
      text-shadow: 0 0 15px rgba(0, 224, 255, 0.5);
    }

    .btn {
      background: linear-gradient(90deg, #00e0ff 0%, #008cff 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 224, 255, 0.4);
      transition: 0.3s ease;
    }

    .btn:hover { transform: scale(1.05); }

    .vehicle-type-selector {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      overflow-x: auto;
      padding: 10px 5px;
    }

    .type-btn {
      background: rgba(20, 30, 50, 0.6);
      border: 1px solid rgba(0, 224, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      padding: 12px 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
    }

    .type-btn.active {
      background: linear-gradient(90deg, #00e0ff 0%, #008cff 100%);
      color: white;
      border: none;
      box-shadow: 0 5px 15px rgba(0, 224, 255, 0.4);
    }

    .vehicles-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }

    .vehicle-card {
      background: rgba(20, 30, 50, 0.6);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid rgba(0, 224, 255, 0.2);
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .vehicle-info h3 { color: #00e0ff; font-size: 1.2rem; }

    .vehicle-actions button {
      padding: 8px 15px;
      margin-right: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .edit-btn { background: #ffc10733; color: #ffc107; }
    .delete-btn { background: #dc354533; color: #dc3545; }
    .service-btn { background: #00e0ff33; color: #00e0ff; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-content {
      background: linear-gradient(135deg, #1a2a4c 0%, #0a0f1c 100%);
      width: 90%; max-width: 500px;
      border-radius: 15px;
      padding: 30px;
      border: 1px solid rgba(0,224,255,0.3);
      box-shadow: 0 0 50px rgba(0,224,255,0.3);
      overflow-y: auto;
      max-height: 90vh;
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input, select {
      width: 100%; padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.901);
      color: #010101;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>

<body>

<aside class="sidebar">
  <a href="{{ url_for('home1') }}" class="back-btn">←</a>

  <div class="logo">
    <h2>AK Vehicle Service</h2>
  </div>

  <div class="sidebar-menu">
    <a href="#"  id="dashboardBtn">Dashboard</a>
    <a href="#" id="serviceStatusBtn">Service Status</a>
    <a href="{{'feedback'}}">Feedback</a>
    <a href="/open" id="logoutBtn">Logout</a>
  </div>
</aside>

<div class="main-content" id="dashboardSection">
  <div class="header">
    <div class="welcome"><h1>Customer Dashboard</h1></div>
    <button class="btn" id="addVehicleBtn">+ Add New Vehicle</button>
  </div>

  <div class="vehicle-type-selector">
    <button class="type-btn active" data-type="all">All</button>
    <button class="type-btn" data-type="two-wheeler">Two Wheeler</button>
    <button class="type-btn" data-type="three-wheeler">Three Wheeler</button>
    <button class="type-btn" data-type="four-wheeler">Four Wheeler</button>
    <button class="type-btn" data-type="commercial">Commercial</button>
    <button class="type-btn" data-type="other">Other</button>
  </div>

  <div class="vehicles-container" id="vehiclesContainer"></div>
</div>

<div class="main-content" id="serviceStatusSection" style="display:none;">
  <h1>Service Status</h1>
  <table id="statusTable" style="width:100%; margin-top:20px; background:rgba(255,255,255,0.05); border-radius: 10px;">
    <tr>
      <th>Vehicle</th>
      <th>Service Type</th>
      <th>Service Date</th>
      <th>Status</th>
    </tr>
  </table>
</div>

<div class="modal" id="vehicleModal">
  <div class="modal-content">
    <h2 id="modalTitle">Add Vehicle</h2>
    <form id="vehicleForm">
      <div class="form-group"><label>Vehicle Type</label>
        <select id="vehicleType" required>
          <option value="">Select</option>
          <option value="two-wheeler">Two Wheeler</option>
          <option value="three-wheeler">Three Wheeler</option>
          <option value="four-wheeler">Four Wheeler</option>
          <option value="commercial">Commercial Vehicle</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group"><label>Make</label><input id="make" required></div>
      <div class="form-group"><label>Model</label><input id="model" required></div>
      <div class="form-group"><label>Year</label><input id="year" type="number" min="1990" max="2025" required></div>
      <div class="form-group"><label>License Plate</label><input id="licensePlate" required></div>
      <div class="form-group"><label>VIN</label><input id="vin" required></div>
      <div class="form-group"><label>Last Service</label><input id="lastService" type="date"></div>
      <div class="form-group"><label>Next Service</label><input id="nextService" type="date"></div>

      <div class="modal-actions">
        <button type="button" class="edit-btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn">Save Vehicle</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="serviceModal">
  <div class="modal-content">
    <h2>Book Service</h2>
    <div class="form-group">
      <label>Vehicle Model</label>
      <input id="serviceVehicle" readonly>
    </div>
    <div class="form-group">
      <label>Preferred Service Date</label>
      <input type="date" id="serviceDate" required>
    </div>
    <div class="form-group">
      <label>Service Type</label>
      <select id="serviceType" required></select>
    </div>
    <div class="modal-actions">
      <button type="button" class="edit-btn" id="closeServiceModal">Cancel</button>
      <button type="button" class="btn" id="saveServiceBtn">Save</button>
    </div>
  </div>
</div>

<script>
  const CURRENT_USER = "{{ session.get('user') }}";
  const LS_KEY = "vehicles_" + CURRENT_USER;

  const dashboardSection = document.getElementById("dashboardSection");
  const serviceStatusSection = document.getElementById("serviceStatusSection");

  document.getElementById("dashboardBtn").onclick = () => {
    dashboardSection.style.display = "block";
    serviceStatusSection.style.display = "none";
  };

  document.getElementById("serviceStatusBtn").onclick = () => {
    dashboardSection.style.display = "none";
    serviceStatusSection.style.display = "block";
    loadServiceStatus();
  };

  async function loadServiceStatus() {
    const res = await fetch("/api/bookings");
    const data = await res.json();

    const bookings = Object.values(data).filter(b => b.user === CURRENT_USER);

    const table = document.getElementById("statusTable");
    table.innerHTML = `
      <tr>
        <th>Vehicle</th><th>Service Type</th><th>Service Date</th><th>Status</th>
      </tr>`;

    if (bookings.length === 0) {
      table.innerHTML += `<tr><td colspan="4" style="text-align:center;">No bookings found</td></tr>`;
      return;
    }

    bookings.forEach(b => {
      table.innerHTML += `
        <tr>
          <td>${b.vehicle_make} ${b.vehicle_model}</td>
          <td>${b.service_type}</td>
          <td>${b.service_date}</td>
          <td>${b.status || "Pending"}</td>
        </tr>`;
    });
  }

  document.getElementById("logoutBtn").onclick = () => {
    window.location.href = "/open";
  };
</script>

<script>
  const serviceOptions = {
    "two-wheeler": ["Engine Oil Change","Brake Inspection","Battery Check","Chain & Sprocket Service","Tyre Replacement"],
    "three-wheeler": ["Engine Tuning","Brake Adjustment","Clutch Overhaul","Electrical System Check","Wheel Alignment"],
    "four-wheeler": ["Full Car Service","AC Repair","Suspension Check","Tyre Balancing","Battery Replacement"],
    "commercial": ["Engine Overhaul","Transmission Service","Brake & Clutch Repair","Hydraulic Check","Tyre Retreading"],
    "other": ["General Checkup","Oil Change","Tyre Replacement","Battery Service"]
  };

  const addBtn = document.getElementById("addVehicleBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const modal = document.getElementById("vehicleModal");
  const serviceModal = document.getElementById("serviceModal");
  const form = document.getElementById("vehicleForm");
  const vehiclesContainer = document.getElementById("vehiclesContainer");
  const closeServiceModal = document.getElementById("closeServiceModal");
  const saveServiceBtn = document.getElementById("saveServiceBtn");
  const serviceVehicle = document.getElementById("serviceVehicle");
  const serviceDate = document.getElementById("serviceDate");
  const serviceType = document.getElementById("serviceType");

  let vehicles = JSON.parse(localStorage.getItem(LS_KEY)) || [];
  let editIndex = null;
  let serviceIndex = null;

  async function syncWithFirebase() {
    const res = await fetch("/api/vehicles");
    const fbVehicles = await res.json();

    vehicles = fbVehicles;
    localStorage.setItem(LS_KEY, JSON.stringify(vehicles));
    renderVehicles();
  }

  function renderVehicles(filter = "all") {
    vehiclesContainer.innerHTML = "";
    const filtered = filter === "all" ? vehicles : vehicles.filter(v => v.vehicleType === filter);

    if (!filtered.length) {
      vehiclesContainer.innerHTML = "<p>No vehicles available.</p>";
      return;
    }

    filtered.forEach((v, i) => {
      const card = document.createElement("div");
      card.className = "vehicle-card";
      card.innerHTML = `
        <div class="vehicle-header">
          <div class="vehicle-info"><h3>${v.make} ${v.model}</h3><small>${v.vehicleType}</small></div>
          <span>${v.year}</span>
        </div>
        <p><strong>License:</strong> ${v.licensePlate}</p>
        <p><strong>Next Service:</strong> ${v.nextService || "-"}</p>
        <div class="vehicle-actions">
          <button class="service-btn" onclick="bookService(${i})">Book Service</button>
          <button class="edit-btn" onclick="editVehicle(${i})">Edit</button>
          <button class="delete-btn" onclick="deleteVehicle(${i})">Delete</button>
        </div>`;
      vehiclesContainer.appendChild(card);
    });
  }

  addBtn.onclick = () => { form.reset(); editIndex = null; modal.style.display = "flex"; };
  cancelBtn.onclick = () => modal.style.display = "none";
  window.onclick = e => { if (e.target === modal) modal.style.display = "none"; if (e.target === serviceModal) serviceModal.style.display = "none"; };

  form.onsubmit = async e => {
    e.preventDefault();
    const data = {
      user: CURRENT_USER,
      vehicleType: vehicleType.value,
      make: make.value,
      model: model.value,
      year: year.value,
      licensePlate: licensePlate.value,
      vin: vin.value,
      lastService: lastService.value,
      nextService: nextService.value
    };
    if (editIndex !== null) vehicles[editIndex] = data; else vehicles.push(data);
    localStorage.setItem(LS_KEY, JSON.stringify(vehicles));
    renderVehicles();
    try {
      await fetch("/addnew", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data) });
    } catch {}
    modal.style.display = "none";
  };

  window.editVehicle = i => {
    editIndex = i;
    const v = vehicles[i];
    modal.style.display = "flex";
    vehicleType.value = v.vehicleType;
    make.value = v.make;
    model.value = v.model;
    year.value = v.year;
    licensePlate.value = v.licensePlate;
    vin.value = v.vin;
    lastService.value = v.lastService;
    nextService.value = v.nextService;
  };

  window.deleteVehicle = i => {
    vehicles.splice(i, 1);
    localStorage.setItem(LS_KEY, JSON.stringify(vehicles));
    renderVehicles();
  };

  window.bookService = i => {
    serviceIndex = i;
    const v = vehicles[i];
    serviceVehicle.value = `${v.make} ${v.model}`;
    serviceDate.value = v.nextService || "";
    serviceType.innerHTML = "";
    serviceOptions[v.vehicleType].forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      serviceType.appendChild(opt);
    });
    serviceModal.style.display = "flex";
  };

  closeServiceModal.onclick = () => serviceModal.style.display = "none";

  saveServiceBtn.onclick = async () => {
    const v = vehicles[serviceIndex];
    v.nextService = serviceDate.value;
    v.serviceType = serviceType.value;
    localStorage.setItem(LS_KEY, JSON.stringify(vehicles));
    renderVehicles();
    try {
      await fetch("/bookservice", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({
          user: CURRENT_USER,
          make: v.make,
          model: v.model,
          serviceType: v.serviceType,
          serviceDate: v.nextService
        })
      });
    } catch {}
    serviceModal.style.display = "none";
  };

  document.querySelectorAll(".type-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderVehicles(btn.dataset.type);
    };
  });

  syncWithFirebase();
</script>

</body>
</html>
