<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Mechanic Portal</title>

    <style>
        /* ---------- Global Styles ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #0a192f, #122d52 40%, #0b1c33);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* ---------- Background Gears ---------- */
        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.08;
            z-index: 0;
        }

        body::before {
            background-image:
                url("https://cdn.pixabay.com/photo/2013/07/12/12/06/gear-145315_1280.png"),
                url("https://cdn.pixabay.com/photo/2016/03/31/21/45/wrench-1294002_1280.png"),
                url("https://cdn.pixabay.com/photo/2017/01/31/13/14/hammer-2021261_1280.png");
            background-position:
                10% 15%,
                70% 25%,
                40% 85%;
            background-size:
                240px,
                200px,
                170px;
        }

        body::after {
            background-image:
                url("https://cdn.pixabay.com/photo/2016/03/31/21/45/gear-1294001_1280.png"),
                url("https://cdn.pixabay.com/photo/2017/01/31/13/16/screw-2021268_1280.png"),
                url("https://cdn.pixabay.com/photo/2012/04/15/21/44/tools-35527_1280.png");
            background-position:
                80% 75%,
                25% 60%,
                60% 35%;
            background-size:
                230px,
                150px,
                160px;
        }

        /* ---------- Container ---------- */
        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px 80px;
            border-radius: 20px;
            border: 2px solid rgba(0, 114, 255, 0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            background-clip: text;
            color: transparent;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 15px 0;
            border: 2px solid #00b7ff;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: transparent;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 200, 255, 0.8);
        }

        /* ---------- Round Back Button ---------- */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 30px;
            width: 45px;
            height: 45px;
            background: transparent;
            border: 2px solid #00b7ff;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            z-index: 5;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
        }

        .back-btn:hover {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.8);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 40px 20px;
            }

            .title {
                font-size: 2rem;
            }

            .btn {
                width: 80%;
                font-size: 1rem;
            }

            .back-btn {
                top: 15px;
                left: 15px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <a href="{{ url_for('home1') }}">
        <button class="back-btn" title="Go Back">⟵</button>
    </a>

    <div class="container">
        <h1 class="title">Welcome to Mechanic Portal</h1>
        <a href="{{ url_for('mech_login') }}" class="btn">Login</a>
        
    </div>
</body>
</html>
