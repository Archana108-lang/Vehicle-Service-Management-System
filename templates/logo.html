<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Vehicle Service Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #1a2a4c 100%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
            padding: 15px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .container.visible {
            opacity: 1;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 100px;
            height: 100px;
            background: rgba(10, 15, 28, 0.8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4px #00e0ff, 0 0 25px rgba(0, 224, 255, 0.8);
            position: relative;
            transition: transform 0.5s ease;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 4px #00e0ff, 0 0 25px rgba(0, 224, 255, 0.8); }
            50% { box-shadow: 0 0 0 8px #00e0ff, 0 0 35px rgba(0, 224, 255, 1); }
            100% { box-shadow: 0 0 0 4px #00e0ff, 0 0 25px rgba(0, 224, 255, 0.8); }
        }

        .logo-icon:hover {
            transform: scale(1.05);
        }

        .logo-icon i {
            font-size: 50px;
            color: #00e0ff;
            text-shadow: 0 0 10px rgba(0, 224, 255, 0.8);
            transition: transform 0.5s ease;
        }

        .logo-icon:hover i {
            transform: scale(1.1);
        }

        .logo-text {
            font-size: 5.5rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px rgba(0, 224, 255, 0.7),
                0 0 20px rgba(0, 224, 255, 0.5),
                0 0 30px rgba(0, 224, 255, 0.3);
            padding: 0 15px;
            position: relative;
            transition: all 0.5s ease;
        }

        .logo-text:hover {
            text-shadow: 
                0 0 10px rgba(0, 224, 255, 0.8),
                0 0 20px rgba(0, 224, 255, 0.6),
                0 0 30px rgba(0, 224, 255, 0.4);
        }

        .title-container {
            text-align: center;
            margin: 0 0 5px 0;
            width: 50%;
        }

        .main-title {
            font-size: 2.8rem;
            background: linear-gradient(to right, #ffffff, #00e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            line-height: 1.5;
            max-width: 800px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a4b4ff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(164, 180, 255, 0.5);
        }

        .get-started {
            padding: 20px 70px;
            font-size: 1.6rem;
            background: transparent;
            color: #dbe0e4ff;
            border: 3px solid #00d3efff;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 224, 255, 0.4);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            z-index: 1;
            margin-top: 20px;
        }

        .get-started::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 224, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .get-started:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 35px rgba(40, 133, 145, 0.94);
            background: rgba(7, 138, 182, 0.99);
        }

        .get-started:hover::before {
            left: 100%;
        }

        /* Intro car animation on road */
        .intro-car {
            position: fixed;
            bottom: 85px;
            left: -300px;
            width: 250px;
            height: 120px;
            z-index: 100;
            animation: introCarMoveOnRoad 8s ease-in-out forwards;
        }

        .car-body {
            position: relative;
            width: 100%;
            height: 70px;
            background: #00e0ff;
            border-radius: 25px 25px 10px 10px;
            box-shadow: 0 0 25px rgba(0, 224, 255, 0.8);
        }

        .car-top {
            position: absolute;
            top: 10px;
            left: 25px;
            width: 60%;
            height: 35px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px 12px 5px 5px;
        }

        .car-window {
            position: absolute;
            top: 15px;
            left: 30px;
            width: 50%;
            height: 25px;
            background: rgba(0, 224, 255, 0.5);
            border-radius: 8px;
        }

        .car-light {
            position: absolute;
            top: 30px;
            right: 15px;
            width: 20px;
            height: 12px;
            background: #ffcc00;
            border-radius: 6px;
            box-shadow: 0 0 15px #ffcc00;
            animation: lightBlink 0.5s infinite alternate;
        }

        .wheel {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            bottom: -20px;
            border: 4px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: wheelRotate 1s linear infinite;
        }

        .wheel::before {
            content: '';
            width: 20px;
            height: 20px;
            background: #444;
            border-radius: 50%;
        }

        .wheel-front {
            right: 40px;
        }

        .wheel-back {
            left: 40px;
        }

        .exhaust {
            position: absolute;
            bottom: 15px;
            left: -8px;
            width: 15px;
            height: 8px;
            background: #666;
            border-radius: 3px;
        }

        .exhaust-smoke {
            position: absolute;
            bottom: 8px;
            left: -20px;
            width: 25px;
            height: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            animation: smoke 0.5s infinite;
        }

        @keyframes introCarMoveOnRoad {
            0% {
                left: -300px;
                transform: scale(1);
            }
            70% {
                left: 50%;
                transform: scale(1);
            }
            80% {
                left: 50%;
                transform: scale(1.1);
            }
            90% {
                left: 50%;
                transform: scale(1);
            }
            100% {
                left: 120%;
                transform: scale(1);
            }
        }

        @keyframes wheelRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes lightBlink {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes smoke {
            0% { 
                transform: scale(1);
                opacity: 0.7;
            }
            100% { 
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* City background */
        .city-background {
            position: fixed;
            bottom: 150px;
            left: 0;
            width: 100%;
            height: 40%;
            z-index: -1;
        }

        .building {
            position: absolute;
            bottom: 0;
            background: #010101;
            width: 8%;
            min-width: 50px;
        }

        .building::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 90%, #222 100%);
        }

        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* Road container */
        .road-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: -1;
            overflow: hidden;
        }

        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: #333;
            z-index: 10;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        }

        .road::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                transparent 0,
                transparent 20px,
                #ffffff 20px,
                #ffffff 40px
            );
            transform: translateY(-50%);
        }

        .road::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        .sidewalk {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 50px;
            background: #555;
            z-index: 9;
        }

        /* Moon */
        .moon {
            position: fixed;
            top: 80px;
            right: 100px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f5f3ce;
            box-shadow: 0 0 30px rgba(245, 243, 206, 0.5), 0 0 50px rgba(245, 243, 206, 0.3);
            z-index: -1;
            animation: moon-glow 4s infinite alternate;
        }

        @keyframes moon-glow {
            0% { box-shadow: 0 0 30px rgba(245, 243, 206, 0.5), 0 0 50px rgba(245, 243, 206, 0.3); }
            100% { box-shadow: 0 0 40px rgba(245, 243, 206, 0.7), 0 0 60px rgba(245, 243, 206, 0.5); }
        }

        .moon::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #d9d7b8;
        }

        /* Background effects matching dashboard */
        .glow {
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,224,255,0.1) 20%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -3;
        }

        .glow-2 {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(40,150,255,0.1) 20%, transparent 70%);
            animation: rotate 15s linear infinite reverse;
            z-index: -4;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .particle {
            position: absolute;
            background: rgba(0, 224, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100vw) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive design */
        @media (max-width: 900px) {
            .main-title {
                font-size: 2.2rem;
            }
            
            .logo-text {
                font-size: 4.5rem;
            }
            
            .logo-icon {
                width: 100px;
                height: 100px;
            }
            
            .logo-icon i {
                font-size: 50px;
            }
            
            .get-started {
                padding: 18px 50px;
                font-size: 1.4rem;
            }
            
            .moon {
                top: 50px;
                right: 50px;
                width: 60px;
                height: 60px;
            }
            
            .intro-car {
                width: 180px;
                height: 90px;
            }
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: 1.8rem;
            }
            
            .logo-text {
                font-size: 3.5rem;
            }
            
            .logo-icon {
                width: 80px;
                height: 80px;
            }
            
            .logo-icon i {
                font-size: 40px;
            }
            
            .get-started {
                padding: 15px 40px;
                font-size: 1.2rem;
            }
            
            .moon {
                top: 30px;
                right: 30px;
                width: 40px;
                height: 40px;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .intro-car {
                width: 150px;
                height: 75px;
            }
        }
    </style>
</head>
<body>
    <!-- Background effects from dashboard -->
    <div class="glow"></div>
    <div class="glow-2"></div>
    
    <!-- Stars -->
    <div class="stars" id="stars"></div>
    
    <!-- Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Moon -->
    <div class="moon"></div>
    
    <!-- City Background -->
    <div class="city-background" id="city"></div>
    
    <!-- Intro Car Animation on Road -->
    <div class="intro-car">
        <div class="car-body">
            <div class="car-top">
                <div class="car-window"></div>
            </div>
            <div class="car-light"></div>
            <div class="wheel wheel-front"></div>
            <div class="wheel wheel-back"></div>
            <div class="exhaust"></div>
            <div class="exhaust-smoke"></div>
        </div>
    </div>
    
    <div class="container" id="main-container">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fas fa-car"></i>
            </div>
            <div class="logo-text">AK</div>
        </div>
        
        <div class="title-container">
            <h1 class="main-title">Vehicle Service Management System</h1>
            <p class="subtitle">Experience the future of vehicle maintenance with our advanced management platform</p>
        </div>
        
        <a href="{{'home1'}}"><button class="get-started" onclick="window.location.href='dashboard.html'"> GET STARTED</button></a>
    </div>
    
    <div class="road-container">
        <div class="sidewalk"></div>
        <div class="road"></div>
        <!-- All small vehicles have been removed, only the large intro car remains -->
    </div>

    <script>
        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random position
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                
                // Random size
                const size = Math.random() * 3;
                
                // Random animation delay
                const delay = Math.random() * 4;
                
                star.style.left = `${left}%`;
                star.style.top = `${top}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.animationDelay = `${delay}s`;
                
                starsContainer.appendChild(star);
            }
        }
        
        // Create buildings
        function createBuildings() {
            const cityContainer = document.getElementById('city');
            const buildingCount = 20;
            
            for (let i = 0; i < buildingCount; i++) {
                const building = document.createElement('div');
                building.classList.add('building');
                
                // Random position
                const left = i * (100 / buildingCount);
                
                // Random height
                const height = 50 + Math.random() * 200;
                
                // Random width
                const width = 5 + Math.random() * 8;
                
                // Random dark color with blueish tint
                const colorValue = Math.floor(Math.random() * 30);
                const blueTint = Math.floor(40 + Math.random() * 60);
                building.style.background = `rgb(${colorValue}, ${colorValue}, ${blueTint})`;
                
                building.style.left = `${left}%`;
                building.style.height = `${height}px`;
                building.style.width = `${width}%`;
                
                cityContainer.appendChild(building);
            }
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                
                // Random size
                const size = Math.random() * 5 + 2;
                
                // Random animation duration
                const duration = 10 + Math.random() * 20;
                
                // Random delay
                const delay = Math.random() * 15;
                
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Show main content after car animation
        function showMainContent() {
            const mainContainer = document.getElementById('main-container');
            mainContainer.classList.add('visible');
        }
        
        // Initialize all elements
        window.onload = function() {
            createStars();
            createBuildings();
            createParticles();
            
            // Show main content after car animation completes (8 seconds)
            setTimeout(showMainContent, 8000);
        };
    </script>
</body>
</html>
